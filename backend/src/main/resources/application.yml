
server:
  port: ${PORT:5000}

spring:
  application:
    name: careerpilot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

app:
  jwt:
    access-secret: "${APP_JWT_ACCESS_SECRET:${JWT_ACCESS_SECRET}}"
    refresh-secret: "${APP_JWT_REFRESH_SECRET:${JWT_REFRESH_SECRET}}"
    access-expiration-ms: 900000
    refresh-expiration-days: 7
  ai-service:
    base-url: ${APP_AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    internal-key: ${INTERNAL_SERVICE_KEY}
  frontend-url: ${APP_FRONTEND_URL}

name: CareerPilot AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Full Stack TypeScript & Linting Quality Gate
  fullstack-check:
    name: Full Stack Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npm --workspace=backend run prisma:generate

      - name: Backend Typecheck & Tests
        run: |
          npm --workspace=backend run typecheck
          npm --workspace=backend run test

      - name: Frontend Typecheck
        run: npm --workspace=frontend run typecheck

  # 2. AI / Python Microservice Unit Tests Gate
  ai-service-check:
    name: AI Microservice Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AI Service Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Service Unit Tests
        run: |
          cd ai-service
          python -m unittest discover -s tests

  # 3. DevOps Docker Multi-Container Build Verification
  docker-build:
    name: Docker Multi-Stage Image Builds
    runs-on: ubuntu-latest
    needs: [fullstack-check, ai-service-check]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: careerpilot-backend:latest

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: careerpilot-ai-service:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: careerpilot-frontend:latest
